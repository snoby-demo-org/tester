name: Build Node Image

# Manually triggered CI: vendors the upstream source (optionally at a specific
# upstream tag), applies patches/, builds the node Docker image, and pushes it.
#
# Push target is configured at scaffold time via imagePushTarget:
#   - 'ghcr'      -> ghcr.io/<owner>/<repo>:<tag>  (uses GITHUB_TOKEN; no secrets)
#   - 'dockerhub' -> <imageRepo>:<tag>             (needs DOCKERHUB_USERNAME/TOKEN secrets)
#
# Runs on the self-hosted k8s runner (ARC scale set <runnerLabel>).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (e.g. v3.0.8). Leave empty for current vendored source.'
        required: false
        default: ''

jobs:
  build:
    runs-on: k8s-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor upstream + apply patches (if tag requested)
        if: inputs.tag != ''
        run: |
          ./patch.sh
          git -C src checkout "$INPUT_TAG"
        env:
          INPUT_TAG: 

      - name: Build image
        run: |
          TAG="${INPUT_TAG:-$(git -C src rev-parse --short HEAD 2>/dev/null || echo local)}"
          IMAGE_REPO="iotapi322/crypto-node" TAG="$TAG" ./build.sh
        env:
          INPUT_TAG: 

      - name: Push image
        env:
          INPUT_TAG: 
          PUSH_TARGET: ghcr
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$(git -C src rev-parse --short HEAD 2>/dev/null || echo local)}"
          if [ "$PUSH_TARGET" = "ghcr" ]; then
            IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${TAG}"
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          else
            IMAGE="iotapi322/crypto-node:${TAG}"
            echo "" | docker login -u "" --password-stdin
          fi
          docker tag "iotapi322/crypto-node:${TAG}" "$IMAGE"
          docker push "$IMAGE"
